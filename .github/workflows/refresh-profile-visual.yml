name: Refresh profile visual

on:
  push:
    paths:
      - ".github/workflows/refresh-profile-visual.yml"
      - "scripts/refresh_profile_visual.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/refresh_profile_visual.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/rag-orbit-v6-final.gif
          git diff --staged --quiet || git commit -m "Refresh RAG profile visual"
          git push
