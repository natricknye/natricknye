<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="144" viewBox="0 0 1200 144" role="img" aria-labelledby="title desc">
  <title id="title">Ask Nate AI</title>
  <desc id="desc">A chat-style entry point with an example question that opens the live personal agent.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b2b"/>
      <stop offset="1" stop-color="#081522"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8f1ff"/>
      <stop offset="1" stop-color="#82cfff"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; }
      .cursor { animation: blink 1.15s steps(1, end) infinite; }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>
  <rect x="18" y="14" width="1164" height="116" rx="22" fill="url(#surface)" stroke="#35617f" stroke-width="1.2"/>
  <circle cx="54" cy="54" r="18" fill="#153b58" stroke="#79d5ff"/>
  <path d="M48 54h12m-6-6 6 6-6 6" fill="none" stroke="#d5f3ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="42" fill="#8fe4ff" font-size="14" font-weight="600" class="sans">Ask Nate AI</text>
  <text x="84" y="63" fill="#7590a6" font-size="12" class="sans">Live agent · example question below</text>
  <text x="84" y="101" fill="#f4f9fd" font-size="24" class="sans">How tall are you?</text>
  <rect x="300" y="82" width="2" height="25" rx="1" fill="#7ed7ff" class="cursor"/>
  <rect x="900" y="39" width="234" height="66" rx="16" fill="url(#button)"/>
  <text x="1017" y="78" text-anchor="middle" fill="#06121f" font-size="20" font-weight="700" class="sans">Open live agent ↗</text>
</svg>
