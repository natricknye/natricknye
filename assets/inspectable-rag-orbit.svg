    <style>
      .sans { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .display { font-family: "Arial Narrow", "Segoe UI", sans-serif; font-weight: 700; letter-spacing: -.8px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; }
      .packet { animation: breathe 2.8s ease-in-out infinite; }
      .orbit-line { stroke-dasharray: 3 12; animation: flow 4s linear infinite; }
      .ascii-front { animation: ascii-front 9s ease-in-out infinite alternate; }
      .ascii-back { animation: ascii-back 11s ease-in-out infinite alternate; }
      @keyframes flow { to { stroke-dashoffset: -30; } }
      @keyframes breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      @keyframes ascii-front { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
      @keyframes ascii-back { from { transform: translateX(18px); } to { transform: translateX(-18px); } }
      @media (prefers-reduced-motion: reduce) {
        .packet, .orbit-line, .ascii-front, .ascii-back { animation: none; }
      }
    </style>
