<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">Inspectable R-A-G</title>
  <desc id="desc">Eight RAG stages arranged around a large rotating ASCII Earth, with an example at every stage.</desc>
  <defs>
    <radialGradient id="bg" cx=".5" cy=".45" r=".78">
      <stop offset="0" stop-color="#0a2035"/>
      <stop offset=".48" stop-color="#071526"/>
      <stop offset="1" stop-color="#030911"/>
    </radialGradient>
    <radialGradient id="globe" cx=".38" cy=".3" r=".72">
      <stop offset="0" stop-color="#174c69"/>
      <stop offset=".55" stop-color="#0a2b43"/>
      <stop offset="1" stop-color="#02070d"/>
    </radialGradient>
    <radialGradient id="globeShade" cx=".36" cy=".28" r=".7">
      <stop offset="0" stop-color="#00050a" stop-opacity="0"/>
      <stop offset=".62" stop-color="#00050a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00050a" stop-opacity=".82"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
