<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">Inspectable R-A-G</title>
  <desc id="desc">An eight-stage RAG pipeline with a concrete example at every stage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061321"/>
      <stop offset=".55" stop-color="#081827"/>
      <stop offset="1" stop-color="#05111d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6c99"/>
      <stop offset=".5" stop-color="#71d0ff"/>
      <stop offset="1" stop-color="#2f6c99"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f273b"/>
      <stop offset="1" stop-color="#0a1a2a"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8bb8df" stroke-opacity=".035"/>
    </pattern>
    <style>
      .sans { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .display { font-family: "Arial Narrow", "Segoe UI", sans-serif; font-weight: 700; letter-spacing: -.8px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; }
      .stage { animation: breathe 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .s2 { animation-delay: -.65s; }
      .s3 { animation-delay: -1.3s; }
      .s4 { animation-delay: -1.95s; }
      .s5 { animation-delay: -2.6s; }
      .s6 { animation-delay: -3.25s; }
      .s7 { animation-delay: -3.9s; }
      .s8 { animation-delay: -4.55s; }
      .flow { stroke-dasharray: 3 12; animation: flow 3s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -30; } }
      @keyframes breathe { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .stage, .flow { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="920" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="920" rx="24" fill="url(#grid)"/>

  <g class="sans">
    <text x="44" y="46" fill="#7894ad" font-size="14" letter-spacing=".8">NATE NYE / AGENTIC ENGINEERING</text>
    <text x="44" y="94" fill="#f4f8fc" font-size="46" class="display">Inspectable R-A-G</text>
    <text x="1156" y="54" text-anchor="end" fill="#71cfff" font-size="14" letter-spacing=".7">LIVE RETRIEVAL SYSTEM</text>
  </g>

  <g>
    <rect x="44" y="126" width="510" height="92" rx="18" fill="url(#soft)" stroke="#3e739b" stroke-opacity=".7"/>
    <circle cx="78" cy="158" r="14" fill="#12314b" stroke="#65bfff"/>
    <path d="M73 158h10m-5-5 5 5-5 5" fill="none" stroke="#d5f3ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106" y="153" fill="#7f9db4" font-size="12.5" letter-spacing=".7">VISITOR QUERY</text>
    <text x="106" y="190" fill="#f4f9fd" font-size="25" font-weight="600">How tall are you?</text>

    <rect x="646" y="126" width="510" height="92" rx="18" fill="#0b2234" stroke="#3d7298" stroke-opacity=".62"/>
    <text x="676" y="153" fill="#78d0ff" font-size="12.5" letter-spacing=".7">KNOWLEDGE BASE</text>
    <text x="676" y="184" fill="#edf7fd" font-size="21" font-weight="600">Identity / personal profile</text>
    <text x="1126" y="184" text-anchor="end" fill="#73d0ff" font-size="24" class="mono">185 cm</text>
  </g>

  <path d="M150 566H1050M1050 566V842M1050 842H150" fill="none" stroke="#24475f" stroke-width="2"/>
  <path class="flow" d="M150 566H1050V842H150" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <circle r="5.5" fill="#b6edff">
      <animateMotion dur="8s" repeatCount="indefinite" path="M150 566 H1050 V842 H150"/>
    </circle>
  </g>

  <g class="stage">
    <text x="56" y="290" fill="#55728a" font-size="13" class="mono">01</text>
    <rect x="86" y="270" width="158" height="92" rx="14" fill="#0b2133" stroke="#4c87ad"/>
    <circle cx="112" cy="298" r="10" fill="none" stroke="#9bdfff" stroke-width="1.4"/>
    <path d="M112 285v7m-6 14c1-8 3-11 6-11s5 3 6 11" fill="none" stroke="#aee6ff" stroke-width="1.3" stroke-linecap="round"/>
    <text x="132" y="296" fill="#f1f8fd" font-size="14" font-weight="600" class="sans">Persona v1</text>
    <text x="132" y="314" fill="#8aa2b6" font-size="11.5" class="sans">SERVER-ONLY</text>
    <rect x="98" y="328" width="52" height="21" rx="6" fill="#12344d"/>
    <text x="124" y="343" text-anchor="middle" fill="#83d8ff" font-size="11" class="mono">0.70</text>
    <rect x="156" y="328" width="76" height="21" rx="6" fill="#12344d"/>
    <text x="194" y="343" text-anchor="middle" fill="#83d8ff" font-size="11" class="mono">thinking off</text>
    <text x="150" y="390" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">Load persona</text>
    <text x="150" y="412" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">locked role · history ≤ 9</text>
  </g>

  <g class="stage s2">
    <text x="356" y="290" fill="#55728a" font-size="13" class="mono">02</text>
    <path d="M370 270h160a14 14 0 0 1 14 14v54a14 14 0 0 1-14 14h-92l-22 17v-17h-46a14 14 0 0 1-14-14v-54a14 14 0 0 1 14-14z" fill="#0b2133" stroke="#4c87ad"/>
    <text x="458" y="300" text-anchor="middle" fill="#f1f8fd" font-size="14" font-weight="600" class="sans">How tall are you?</text>
    <text x="458" y="320" text-anchor="middle" fill="#84d8ff" font-size="11" class="mono">18 chars · EN</text>
    <text x="450" y="390" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">Read query</text>
    <text x="450" y="412" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">length guard · 1,000 max</text>
  </g>

  <g class="stage s3">
    <text x="656" y="290" fill="#55728a" font-size="13" class="mono">03</text>
    <rect x="674" y="270" width="152" height="90" rx="14" fill="#0b2133" stroke="#4c87ad"/>
    <text x="750" y="295" text-anchor="middle" fill="#7f9ab0" font-size="11.5" class="mono">TOKENIZE RESULT</text>
    <g fill="#8aa5ba" font-size="13" class="mono">
      <rect x="688" y="307" width="40" height="22" rx="5" fill="#12344d"/><text x="708" y="322" text-anchor="middle">how</text>
      <rect x="734" y="307" width="40" height="22" rx="5" fill="#12344d"/><text x="754" y="322" text-anchor="middle">tall</text>
      <rect x="780" y="307" width="34" height="22" rx="5" fill="#12344d"/><text x="797" y="322" text-anchor="middle">you</text>
    </g>
    <text x="750" y="349" text-anchor="middle" fill="#76d3ff" font-size="11" class="mono">3 query tokens</text>
    <text x="750" y="390" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">Tokenize</text>
    <text x="750" y="412" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">NFKC · normalize · token split</text>
  </g>

  <g class="stage s4">
    <text x="956" y="290" fill="#55728a" font-size="13" class="mono">04</text>
    <rect x="950" y="270" width="194" height="88" rx="14" fill="#0b2133" stroke="#4c87ad"/>
    <rect x="966" y="284" width="162" height="18" rx="4" fill="#12344d"/>
    <text x="976" y="297" fill="#9edfff" font-size="10.5" class="mono">K023 · identity</text>
    <rect x="966" y="307" width="162" height="18" rx="4" fill="#0e2a40"/>
    <text x="976" y="320" fill="#839cb0" font-size="10.5" class="mono">K014 · interests</text>
    <rect x="966" y="330" width="162" height="18" rx="4" fill="#0e2a40"/>
    <text x="976" y="343" fill="#839cb0" font-size="10.5" class="mono">K020 · travel</text>
    <text x="1050" y="390" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">Recall</text>
    <text x="1050" y="412" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">3 hits · local knowledge base</text>
  </g>

  <g class="stage s5">
    <text x="956" y="667" fill="#55728a" font-size="13" class="mono">05</text>
    <rect x="928" y="635" width="224" height="112" rx="14" fill="#0b2133" stroke="#4c87ad"/>
    <text x="948" y="658" fill="#f0f7fc" font-size="12.5" class="mono">K023</text>
    <rect x="994" y="649" width="124" height="9" rx="4" fill="#1a3e58"/>
    <rect x="994" y="649" width="124" height="9" rx="4" fill="#69cfff"/>
    <text x="1132" y="659" text-anchor="end" fill="#85d8ff" font-size="11" class="mono">18</text>
    <text x="948" y="682" fill="#a5bacb" font-size="12.5" class="mono">K014</text>
    <rect x="994" y="673" width="124" height="9" rx="4" fill="#1a3e58"/>
    <rect x="994" y="673" width="48" height="9" rx="4" fill="#4f9bc5"/>
    <text x="1132" y="683" text-anchor="end" fill="#82b8d6" font-size="11" class="mono">7</text>
    <text x="948" y="706" fill="#859eb2" font-size="12.5" class="mono">K020</text>
    <rect x="994" y="697" width="124" height="9" rx="4" fill="#1a3e58"/>
    <rect x="994" y="697" width="22" height="9" rx="4" fill="#366f91"/>
    <text x="1132" y="707" text-anchor="end" fill="#7497b1" font-size="11" class="mono">3</text>
    <text x="1040" y="735" text-anchor="middle" fill="#8ddfc0" font-size="11.5" class="mono">keep K023 · cutoff ≥3</text>
    <text x="1040" y="785" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">Rerank</text>
    <text x="1040" y="807" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">body ×1 · alias ×4 · phrase +8</text>
  </g>

  <g class="stage s6">
    <text x="656" y="667" fill="#55728a" font-size="13" class="mono">06</text>
    <rect x="646" y="635" width="194" height="112" rx="14" fill="#0b2133" stroke="#4c87ad"/>
    <text x="666" y="660" fill="#7f9ab0" font-size="11.5" class="mono">CONTEXT WINDOW</text>
    <path d="M666 673h154M666 690h154M666 707h116" stroke="#34607c" stroke-width="1.2"/>
    <rect x="664" y="670" width="158" height="25" rx="5" fill="#12344d" stroke="#68c8f6"/>
    <text x="674" y="687" fill="#a9e4ff" font-size="10.5" class="mono">[K023] Personal profile</text>
    <text x="666" y="730" fill="#84d8ff" font-size="11" class="mono">1 / 4 sources · 96 chars</text>
    <text x="743" y="785" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">Assemble context</text>
    <text x="743" y="807" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">ranked facts · 1,800 char budget</text>
  </g>

  <g class="stage s7">
    <text x="356" y="667" fill="#55728a" font-size="13" class="mono">07</text>
    <rect x="356" y="635" width="188" height="112" rx="14" fill="#0b2133" stroke="#4c87ad"/>
    <text x="450" y="660" text-anchor="middle" fill="#7f9ab0" font-size="11.5" class="mono">MODEL CONTEXT</text>
    <g class="sans" font-size="11.5">
      <rect x="376" y="672" width="62" height="21" rx="5" fill="#12344d"/>
      <text x="407" y="687" text-anchor="middle" fill="#9fdcff">persona</text>
      <text x="446" y="687" fill="#54748e">→</text>
      <rect x="458" y="672" width="68" height="21" rx="5" fill="#12344d"/>
      <text x="492" y="687" text-anchor="middle" fill="#9fdcff">knowledge</text>
      <rect x="376" y="699" width="150" height="20" rx="5" fill="#0e2a40"/>
      <text x="451" y="713" text-anchor="middle" fill="#7794aa">deepseek-v4-flash</text>
    </g>
    <text x="450" y="785" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">Generate</text>
    <text x="450" y="807" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">temp 0.70 · max 400 · timeout 25s</text>
  </g>

  <g class="stage s8">
    <text x="56" y="667" fill="#55728a" font-size="13" class="mono">08</text>
    <rect x="54" y="635" width="192" height="112" rx="14" fill="#0b2133" stroke="#4c87ad"/>
    <path d="M76 660h132a10 10 0 0 1 10 10v30a10 10 0 0 1-10 10h-74l-18 13v-13H76a10 10 0 0 1-10-10v-30a10 10 0 0 1 10-10z" fill="#102c40" stroke="#4c87ad"/>
    <text x="142" y="684" text-anchor="middle" fill="#f3f9fd" font-size="13" class="sans">I'm 185 cm tall.</text>
    <text x="142" y="707" text-anchor="middle" fill="#81d7ff" font-size="10.5" class="mono">1 source · returned</text>
    <text x="150" y="785" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">Return answer</text>
    <text x="150" y="807" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">grounded output · source trace</text>
  </g>
</svg>
