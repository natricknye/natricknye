<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Inspectable R-A-G</title>
  <desc id="desc">An eight-stage RAG pipeline with a concrete example at every stage and a rotating ASCII Earth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071821"/>
      <stop offset=".52" stop-color="#0a2431"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3bb9df"/>
      <stop offset=".42" stop-color="#82e7ff"/>
      <stop offset=".72" stop-color="#ffd68e"/>
      <stop offset="1" stop-color="#65dcb8"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103248"/>
      <stop offset="1" stop-color="#0a1b2b"/>
    </linearGradient>
    <radialGradient id="cyanHaze" cx=".12" cy=".08" r=".7">
      <stop offset="0" stop-color="#20b9d8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberHaze" cx=".95" cy=".12" r=".55">
      <stop offset="0" stop-color="#ffb75f" stop-opacity=".13"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globeFill" cx=".38" cy=".28" r=".72">
      <stop offset="0" stop-color="#164c67"/>
      <stop offset=".62" stop-color="#0a2b42"/>
      <stop offset="1" stop-color="#071521"/>
    </radialGradient>
    <clipPath id="asciiGlobeClip">
      <circle cx="1090" cy="82" r="46"/>
    </clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8bb8df" stroke-opacity=".035"/>
    </pattern>
    <style>
      .sans { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .display { font-family: "Arial Narrow", "Segoe UI", sans-serif; font-weight: 700; letter-spacing: -.8px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; }
      .stage { animation: breathe 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .s2 { animation-delay: -.65s; }
      .s3 { animation-delay: -1.3s; }
      .s4 { animation-delay: -1.95s; }
      .s5 { animation-delay: -2.6s; }
      .s6 { animation-delay: -3.25s; }
      .s7 { animation-delay: -3.9s; }
      .s8 { animation-delay: -4.55s; }
      .flow { stroke-dasharray: 3 12; animation: flow 3s linear infinite; }
      .ascii { font-family: Consolas, "Cascadia Code", monospace; font-size: 6.8px; letter-spacing: .1px; }
      .ascii-drift { animation: ascii-drift 7s ease-in-out infinite alternate; }
      @keyframes flow { to { stroke-dashoffset: -30; } }
      @keyframes breathe { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
      @keyframes ascii-drift { from { transform: translateX(-7px); } to { transform: translateX(7px); } }
      @media (prefers-reduced-motion: reduce) {
        .stage, .flow, .ascii-drift { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="840" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="840" rx="24" fill="url(#grid)"/>
  <rect width="660" height="430" fill="url(#cyanHaze)"/>
  <rect x="600" width="600" height="360" fill="url(#amberHaze)"/>

  <g class="sans">
    <text x="44" y="46" fill="#7894ad" font-size="14" letter-spacing=".8">NATE NYE / AGENTIC ENGINEERING</text>
    <text x="44" y="94" fill="#f4f8fc" font-size="46" class="display">Inspectable R-A-G</text>
  </g>

  <g aria-hidden="true">
    <text x="1133" y="27" text-anchor="end" fill="#72b7c9" font-size="9" letter-spacing="1.1" class="mono">ASCII EARTH</text>
    <circle cx="1090" cy="82" r="53" fill="#51d9ff" opacity=".08" filter="url(#glow)"/>
    <circle cx="1090" cy="82" r="46" fill="url(#globeFill)" stroke="#6fdafa" stroke-opacity=".7"/>
    <g clip-path="url(#asciiGlobeClip)" fill="#89e5ff" opacity=".74">
      <g class="ascii-drift" xml:space="preserve">
        <text x="1041" y="42" class="ascii">        ..:::...        </text>
        <text x="1041" y="49" class="ascii">     .:-=+*#*+=:.     </text>
        <text x="1041" y="56" class="ascii">   .:=*#%@@%@@%#*=:.  </text>
        <text x="1041" y="63" class="ascii">  :=+*#@@@@@@@@@@#+=:. </text>
        <text x="1041" y="70" class="ascii"> .+*%@@@@@@@%@@@@@@%+.</text>
        <text x="1041" y="77" class="ascii"> :=%@@@@%#*#@@@@@@@@%=</text>
        <text x="1041" y="84" class="ascii"> -+#@@@@@*=:+#@@@@@@#+</text>
        <text x="1041" y="91" class="ascii"> .=*%@@@@@*+*@@@@@@%*=</text>
        <text x="1041" y="98" class="ascii">  :+#@@@@@@@@@@@@@@#=:</text>
        <text x="1041" y="105" class="ascii">   .-+*#@@@@@@@%#*+=:. </text>
        <text x="1041" y="112" class="ascii">      .:=+**#**+=:.    </text>
        <text x="1041" y="119" class="ascii">          ..::.        </text>
      </g>
    </g>
    <ellipse cx="1090" cy="82" rx="42" ry="14" transform="rotate(-18 1090 82)" fill="none" stroke="#b5f1ff" stroke-opacity=".2"/>
    <ellipse cx="1090" cy="82" rx="25" ry="44" fill="none" stroke="#b5f1ff" stroke-opacity=".16"/>
    <circle cx="1090" cy="82" r="46" fill="none" stroke="#9beeff" stroke-opacity=".8"/>
  </g>

  <g>
    <rect x="44" y="126" width="510" height="92" rx="18" fill="url(#soft)" stroke="#48c9e8" stroke-opacity=".72"/>
    <circle cx="78" cy="158" r="14" fill="#12314b" stroke="#65bfff"/>
    <path d="M73 158h10m-5-5 5 5-5 5" fill="none" stroke="#d5f3ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106" y="153" fill="#7f9db4" font-size="12.5" letter-spacing=".7">VISITOR QUERY</text>
    <text x="106" y="190" fill="#f4f9fd" font-size="25" font-weight="600">How tall are you?</text>

    <rect x="646" y="126" width="510" height="92" rx="18" fill="#0b2430" stroke="#4fd0b5" stroke-opacity=".72"/>
    <text x="676" y="153" fill="#7ee8c8" font-size="12.5" letter-spacing=".7">KNOWLEDGE BASE</text>
    <text x="676" y="184" fill="#edf7fd" font-size="21" font-weight="600">Identity / personal profile</text>
    <text x="1126" y="184" text-anchor="end" fill="#ffd38a" font-size="24" class="mono">185 cm</text>
  </g>

  <path d="M150 500H1050M1050 500V758M1050 758H150" fill="none" stroke="#2b5268" stroke-width="2"/>
  <path class="flow" d="M150 500H1050V758H150" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <circle r="5.5" fill="#b6edff">
      <animateMotion dur="8s" repeatCount="indefinite" path="M150 500 H1050 V758 H150"/>
    </circle>
  </g>

  <g class="stage">
    <rect x="86" y="270" width="158" height="92" rx="14" fill="#0b2133" stroke="#55c8e8"/>
    <circle cx="112" cy="298" r="10" fill="none" stroke="#8ee8ff" stroke-width="1.4"/>
    <path d="M112 285v7m-6 14c1-8 3-11 6-11s5 3 6 11" fill="none" stroke="#aee6ff" stroke-width="1.3" stroke-linecap="round"/>
    <text x="132" y="296" fill="#f1f8fd" font-size="14" font-weight="600" class="sans">Persona v1</text>
    <text x="132" y="314" fill="#8aa2b6" font-size="11.5" class="sans">SERVER-ONLY</text>
    <rect x="98" y="328" width="52" height="21" rx="6" fill="#12344d"/>
    <text x="124" y="343" text-anchor="middle" fill="#8ee8ff" font-size="11" class="mono">0.70</text>
    <rect x="156" y="328" width="76" height="21" rx="6" fill="#12344d"/>
    <text x="194" y="343" text-anchor="middle" fill="#8ee8ff" font-size="11" class="mono">thinking off</text>
    <text x="150" y="390" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">01 · Load persona</text>
    <text x="150" y="412" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">locked role · history ≤ 9</text>
  </g>

  <g class="stage s2">
    <path d="M370 270h160a14 14 0 0 1 14 14v54a14 14 0 0 1-14 14h-92l-22 17v-17h-46a14 14 0 0 1-14-14v-54a14 14 0 0 1 14-14z" fill="#102337" stroke="#e3b761"/>
    <text x="458" y="300" text-anchor="middle" fill="#f1f8fd" font-size="14" font-weight="600" class="sans">How tall are you?</text>
    <text x="458" y="320" text-anchor="middle" fill="#ffd48d" font-size="11" class="mono">16 chars · EN</text>
    <text x="450" y="390" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">02 · Read query</text>
    <text x="450" y="412" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">length guard · 1,000 max</text>
  </g>

  <g class="stage s3">
    <rect x="674" y="270" width="152" height="90" rx="14" fill="#111d36" stroke="#8b93e9"/>
    <text x="750" y="295" text-anchor="middle" fill="#7f9ab0" font-size="11.5" class="mono">TOKENIZE RESULT</text>
    <g fill="#c2c8ff" font-size="13" class="mono">
      <rect x="688" y="307" width="40" height="22" rx="5" fill="#1b2b50"/><text x="708" y="322" text-anchor="middle">how</text>
      <rect x="734" y="307" width="40" height="22" rx="5" fill="#1b2b50"/><text x="754" y="322" text-anchor="middle">tall</text>
      <rect x="780" y="307" width="34" height="22" rx="5" fill="#1b2b50"/><text x="797" y="322" text-anchor="middle">you</text>
    </g>
    <text x="750" y="349" text-anchor="middle" fill="#b8beff" font-size="11" class="mono">3 query tokens</text>
    <text x="750" y="390" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">03 · Tokenize</text>
    <text x="750" y="412" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">NFKC · normalize · token split</text>
  </g>

  <g class="stage s4">
    <rect x="950" y="270" width="194" height="88" rx="14" fill="#08252a" stroke="#56d1b5"/>
    <rect x="966" y="284" width="162" height="18" rx="4" fill="#12423f"/>
    <text x="976" y="297" fill="#a5f2dd" font-size="10.5" class="mono">K023 · identity</text>
    <rect x="966" y="307" width="162" height="18" rx="4" fill="#0d3035"/>
    <text x="976" y="320" fill="#77b5aa" font-size="10.5" class="mono">K014 · interests</text>
    <rect x="966" y="330" width="162" height="18" rx="4" fill="#0d3035"/>
    <text x="976" y="343" fill="#77b5aa" font-size="10.5" class="mono">K020 · travel</text>
    <text x="1050" y="390" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">04 · Recall</text>
    <text x="1050" y="412" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">3 hits · local knowledge base</text>
  </g>

  <g class="stage s5" transform="translate(0 -80)">
    <rect x="928" y="635" width="224" height="112" rx="14" fill="#281e28" stroke="#e8967d"/>
    <text x="948" y="658" fill="#f0f7fc" font-size="12.5" class="mono">K023</text>
    <rect x="994" y="649" width="124" height="9" rx="4" fill="#1a3e58"/>
    <rect x="994" y="649" width="124" height="9" rx="4" fill="#ffd38b"/>
    <text x="1132" y="659" text-anchor="end" fill="#ffd7a2" font-size="11" class="mono">18</text>
    <text x="948" y="682" fill="#a5bacb" font-size="12.5" class="mono">K014</text>
    <rect x="994" y="673" width="124" height="9" rx="4" fill="#1a3e58"/>
    <rect x="994" y="673" width="14" height="9" rx="4" fill="#d59b75"/>
    <text x="1132" y="683" text-anchor="end" fill="#d8b79d" font-size="11" class="mono">2</text>
    <text x="948" y="706" fill="#859eb2" font-size="12.5" class="mono">K020</text>
    <rect x="994" y="697" width="124" height="9" rx="4" fill="#1a3e58"/>
    <rect x="994" y="697" width="7" height="9" rx="3" fill="#8d786c"/>
    <text x="1132" y="707" text-anchor="end" fill="#b79d90" font-size="11" class="mono">1</text>
    <text x="1040" y="735" text-anchor="middle" fill="#9de8cf" font-size="11.5" class="mono">keep K023 · cutoff ≥3</text>
    <text x="1040" y="785" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">05 · Rerank</text>
    <text x="1040" y="807" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">body ×1 · alias ×4 · phrase +8</text>
  </g>

  <g class="stage s6" transform="translate(0 -80)">
    <rect x="646" y="635" width="194" height="112" rx="14" fill="#092a2f" stroke="#52c9c1"/>
    <text x="666" y="660" fill="#7f9ab0" font-size="11.5" class="mono">CONTEXT WINDOW</text>
    <path d="M666 673h154M666 690h154M666 707h116" stroke="#34607c" stroke-width="1.2"/>
    <rect x="664" y="670" width="158" height="25" rx="5" fill="#123f42" stroke="#75e1d0"/>
    <text x="674" y="687" fill="#b4f5e7" font-size="10.5" class="mono">[K023] Personal profile</text>
    <text x="666" y="730" fill="#8ce5d4" font-size="11" class="mono">1 selected · 96 chars</text>
    <text x="743" y="785" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">06 · Assemble context</text>
    <text x="743" y="807" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">ranked facts · 1,800 char budget</text>
  </g>

  <g class="stage s7" transform="translate(0 -80)">
    <rect x="356" y="635" width="188" height="112" rx="14" fill="#151d37" stroke="#899df1"/>
    <text x="450" y="660" text-anchor="middle" fill="#7f9ab0" font-size="11.5" class="mono">MODEL CONTEXT</text>
    <g class="sans" font-size="11.5">
      <rect x="376" y="672" width="62" height="21" rx="5" fill="#202b50"/>
      <text x="407" y="687" text-anchor="middle" fill="#c3d1ff">persona</text>
      <text x="446" y="687" fill="#54748e">→</text>
      <rect x="458" y="672" width="68" height="21" rx="5" fill="#202b50"/>
      <text x="492" y="687" text-anchor="middle" fill="#c3d1ff">knowledge</text>
      <rect x="376" y="699" width="150" height="20" rx="5" fill="#0e2a40"/>
      <text x="451" y="713" text-anchor="middle" fill="#91a6d4">deepseek-v4-flash</text>
    </g>
    <text x="450" y="785" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">07 · Generate</text>
    <text x="450" y="807" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">temp 0.70 · max 400 · timeout 25s</text>
  </g>

  <g class="stage s8" transform="translate(0 -80)">
    <rect x="54" y="635" width="192" height="112" rx="14" fill="#0b2521" stroke="#69d99e"/>
    <path d="M76 660h132a10 10 0 0 1 10 10v30a10 10 0 0 1-10 10h-74l-18 13v-13H76a10 10 0 0 1-10-10v-30a10 10 0 0 1 10-10z" fill="#12352d" stroke="#69d99e"/>
    <text x="142" y="684" text-anchor="middle" fill="#f1fff8" font-size="13" class="sans">I'm 185 cm tall.</text>
    <text x="142" y="707" text-anchor="middle" fill="#8ae5b1" font-size="10.5" class="mono">1 source · returned</text>
    <text x="150" y="785" text-anchor="middle" fill="#f2f8fc" font-size="20" font-weight="600" class="sans">08 · Return answer</text>
    <text x="150" y="807" text-anchor="middle" fill="#7f9ab0" font-size="13" class="sans">grounded output · source trace</text>
  </g>
</svg>
